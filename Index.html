<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--bg:#0d1514;--panel:#14201e;--panel2:#1b2a27;--line:#2b403b;--text:#edf7f2;--muted:#9bb2aa;--mint:#a7f3d0;--teal:#42c9ae;--danger:#ffaaa7;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--mint);color:#10231d}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#4a2727;color:#ffd8d6}button:disabled{opacity:.5;cursor:wait}input,textarea,select{width:100%;padding:11px 12px;border-radius:10px;background:#0d1715;border:1px solid var(--line);color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--teal)}textarea{min-height:110px;resize:vertical}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}.app{max-width:1200px;margin:auto;padding:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:#1d4b40;color:var(--mint);display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;margin:2px 0 0;color:var(--muted);letter-spacing:.1em}.userbar{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding-top:24px}.sidebar{display:flex;flex-direction:column;gap:6px}.navbtn{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent}.navbtn.active,.navbtn:hover{background:var(--panel);border-color:var(--line);color:var(--text)}.side-label{font-size:11px;color:#78938a;letter-spacing:.12em;margin:18px 10px 5px}.content{min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}.page-head h2{font-size:27px;letter-spacing:-.03em;margin:0}.page-head p{color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.card h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.metric{font-size:30px;font-weight:750;letter-spacing:-.04em}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);color:var(--mint);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}.stack{display:flex;flex-direction:column;gap:12px}.item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.item-main{min-width:0}.item h3{margin:0 0 4px}.item p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}.notice{padding:12px 14px;border-radius:10px;background:#1b352d;color:var(--mint);margin-bottom:16px}.error{background:#422524;color:var(--danger)}.auth-wrap{max-width:470px;margin:8vh auto;padding:20px}.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}.auth-card h2{font-size:25px;margin:0 0 4px}.auth-card>p{color:var(--muted);margin:0 0 20px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.tabs .selected{background:var(--mint);color:#10231d}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:18px 0}.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.modal-head h2{margin:0}.link{color:var(--mint);overflow-wrap:anywhere}.foot{color:#78938a;font-size:12px;text-align:center;padding:32px 0 12px}.badge-row{display:flex;gap:8px;flex-wrap:wrap}.mobile-menu{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line);padding-bottom:16px}.side-label{grid-column:1/-1;margin-top:10px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.app{padding:14px}.topbar{align-items:flex-start}.userbar{flex-direction:column;align-items:flex-end}.page-head h2{font-size:23px}}@media(max-width:480px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{gap:8px}.brand p{font-size:10px}.userbar #user-name{display:none}.sidebar{grid-template-columns:1fr 1fr}.page-head{flex-direction:column}}
</style></head><body><div id="root"><div class="auth-wrap"><div class="auth-card"><div class="brand"><div class="logo">R</div><div><h1>Revival Labs</h1><p>CLASSROOM</p></div></div><p style="margin-top:22px">Loading your classroom…</p></div></div></div><div id="modal-root"></div><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('rlc_token')||'';let currentUser=null;let dashboardData=null;let activePage='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=s=>{if(!s)return 'No due date';const d=new Date(String(s).length===10?s+'T12:00:00':s);return isNaN(d)?esc(s):d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});};
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(!r||!r.ok){if(r&&r.error==='Your session has expired. Please sign in again.'){logoutLocal();}reject(new Error(r&&r.error||'Request failed'));}else resolve(r);}).withFailureHandler(e=>reject(new Error(e.message||'Server request failed'))).api(action,{...payload,token}));}
function showError(err){const el=$('global-notice');if(el){el.textContent=err.message||String(err);el.classList.remove('hidden');el.classList.add('error');}else alert(err.message||String(err));}
function notice(text){const el=$('global-notice');if(el){el.textContent=text;el.classList.remove('hidden','error');}}
function logoutLocal(){token='';currentUser=null;localStorage.removeItem('rlc_token');renderAuth();}
function renderAuth(mode='login'){ $('root').innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="brand"><div class="logo">R</div><div><h1>Revival Labs</h1><p>CLASSROOM</p></div></div><h2 style="margin-top:24px">Your next project starts here.</h2><p>Access your classes, lessons, and assignments.</p><div class="tabs"><button class="${mode==='login'?'selected':'secondary'}" id="tab-login">Sign in</button><button class="${mode==='register'?'selected':'secondary'}" id="tab-register">Create account</button></div><div id="global-notice" class="notice hidden"></div><form id="auth-form"><div id="register-fields" class="${mode==='register'?'':'hidden'}"><label for="display-name">Display name</label><input id="display-name" maxlength="48" autocomplete="name" placeholder="Your name"><label for="class-id">Enroll in</label><select id="class-id"><option value="class-a">Class A — Foundations</option><option value="class-b">Class B — Backend Development</option><option value="class-c">Class C — Systems Engineering</option></select></div><label for="username">Username</label><input id="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="your_username"><label for="password">Password</label><input id="password" type="password" required minlength="10" maxlength="100" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="At least 10 characters">${mode==='register'?'<p class="small muted">Use a unique password. Do not reuse your Google or Discord password.</p>':''}<button id="auth-submit" style="width:100%;margin-top:18px" type="submit">${mode==='login'?'Sign in':'Create student account'}</button></form><p class="small muted" style="margin-top:16px">Demo course platform. Do not submit sensitive personal information.</p></div></div>`;
$('tab-login').onclick=()=>renderAuth('login');$('tab-register').onclick=()=>renderAuth('register');$('auth-form').onsubmit=async e=>{e.preventDefault();const btn=$('auth-submit');btn.disabled=true;btn.textContent='Please wait…';try{const action=mode==='login'?'login':'register';const p={username:$('username').value,password:$('password').value};if(mode==='register'){p.displayName=$('display-name').value;p.classId=$('class-id').value;}const r=await callPublic(action,p);token=r.token;currentUser=r.user;localStorage.setItem('rlc_token',token);await loadApp();}catch(err){const el=$('global-notice');el.textContent=err.message;el.classList.remove('hidden');el.classList.add('error');btn.disabled=false;btn.textContent=mode==='login'?'Sign in':'Create student account';}};}
function callPublic(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(!r||!r.ok)reject(new Error(r&&r.error||'Request failed'));else resolve(r);}).withFailureHandler(e=>reject(new Error(e.message||'Server request failed'))).api(action,payload));}
async function loadApp(){try{dashboardData=await call('getDashboard');currentUser=dashboardData.user;renderShell();renderPage('overview');}catch(e){logoutLocal();}}
function renderShell(){const isStaff=currentUser.role==='admin'||currentUser.role==='instructor';$('root').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>Revival Labs Classroom</h1><p>EDUCATION · DEVELOPMENT · PRESERVATION</p></div></div><div class="userbar"><span id="user-name">${esc(currentUser.displayName)}</span><span class="pill">${esc(currentUser.role)}</span><button class="secondary" id="logout-btn">Sign out</button></div></header><div class="layout"><nav class="sidebar"><div class="side-label">WORKSPACE</div><button class="navbtn active" data-page="overview">⌂ &nbsp; Overview</button><button class="navbtn" data-page="classes">▤ &nbsp; My classes</button><button class="navbtn" data-page="assignments">▣ &nbsp; Assignments</button><button class="navbtn" data-page="lessons">▧ &nbsp; Lessons</button><button class="navbtn" data-page="announcements">◉ &nbsp; Announcements</button>${isStaff?'<div class="side-label">INSTRUCTOR</div><button class="navbtn" data-page="manage">＋ &nbsp; Create coursework</button><button class="navbtn" data-page="grading">✓ &nbsp; Review submissions</button><button class="navbtn" data-page="students">♙ &nbsp; Enrollment</button>':''}<div class="side-label">HELP</div><button class="navbtn" data-page="about">ⓘ &nbsp; About classroom</button></nav><main class="content"><div id="global-notice" class="notice hidden"></div><div id="page-content"></div></main></div><div class="foot">Revival Labs Classroom · Built with Google Apps Script</div></div>`;
$('logout-btn').onclick=async()=>{try{await call('logout')}catch(e){}logoutLocal();};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>renderPage(b.dataset.page));}
function setActive(page){activePage=page;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function head(title,subtitle,button=''){return `<div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div>${button}</div>`;}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`;}
function classCard(c){return `<div class="card"><div class="badge-row"><span class="pill">${esc(c.level)}</span><span class="pill">${esc(c.duration)}</span></div><h3 style="margin-top:14px">${esc(c.name)}</h3><p class="muted">${esc(c.description)}</p><div class="actions"><button class="secondary" onclick="openClass('${esc(c.id)}')">Open class</button></div></div>`;}
function assignmentCard(a){const s=a.mySubmission;return `<div class="card"><div class="item"><div class="item-main"><span class="pill">${esc(a.className||'Coursework')}</span><h3 style="margin-top:10px">${esc(a.title)}</h3></div><span class="pill">${s&&s.status==='graded'?'Graded':s?'Submitted':'Open'}</span></div><p class="muted small">Due: ${dateFmt(a.dueDate)} · ${esc(a.points)} points</p><p>${esc((a.instructions||'').slice(0,260))}${(a.instructions||'').length>260?'…':''}</p>${a.resourceUrl?`<p><a class="link" href="${esc(a.resourceUrl)}" target="_blank" rel="noopener">Open resource ↗</a></p>`:''}${s?`<div class="divider"></div><p class="small muted">Submitted ${dateFmt(s.submittedAt)} · ${s.status==='graded'?'Grade: '+esc(s.grade)+' / '+esc(a.points):'Awaiting review'}</p>${s.feedback?`<p>${esc(s.feedback)}</p>`:''}`:''}<div class="actions"><button onclick="openAssignment('${esc(a.id)}')">${s?'View / resubmit':'View assignment'}</button></div></div>`;}
function lessonCard(l){return `<div class="card"><h3>${esc(l.title)}</h3><p class="muted small">${esc(l.classId)}</p><p>${esc((l.content||'').slice(0,220))}${(l.content||'').length>220?'…':''}</p>${l.resourceUrl?`<p><a class="link" href="${esc(l.resourceUrl)}" target="_blank" rel="noopener">Open resource ↗</a></p>`:''}<div class="actions"><button class="secondary" onclick="viewLesson('${esc(l.id)}')">Read lesson</button></div></div>`;}
function renderPage(page){setActive(page);const c=$('page-content');if(!c)return;const staff=currentUser.role==='admin'||currentUser.role==='instructor';if(['manage','grading','students'].includes(page)&&!staff){page='overview';setActive(page);}const data=dashboardData;
if(page==='overview'){c.innerHTML=head('Welcome back, '+esc(currentUser.displayName.split(' ')[0]),'Here is what is happening in your classroom.')+`<div class="grid"><div class="card"><p class="muted small">AVAILABLE ASSIGNMENTS</p><div class="metric">${data.stats.assignments}</div></div><div class="card"><p class="muted small">SUBMITTED</p><div class="metric">${data.stats.submitted}</div></div><div class="card"><p class="muted small">GRADED</p><div class="metric">${data.stats.graded}</div></div></div><div class="divider"></div><div class="page-head"><div><h2 style="font-size:20px">Upcoming coursework</h2><p>Your latest published assignments.</p></div><button class="secondary" onclick="renderPage('assignments')">View all</button></div><div class="grid two">${data.assignments.slice(0,4).map(assignmentCard).join('')||empty('No assignments have been published yet.')}</div><div class="divider"></div><div class="page-head"><div><h2 style="font-size:20px">Your classes</h2><p>Open a class to see its lessons and coursework.</p></div></div><div class="grid">${data.classes.map(classCard).join('')}</div>`;
}else if(page==='classes'){c.innerHTML=head('My classes','Your enrolled learning track.')+`<div class="grid">${data.classes.map(classCard).join('')||empty('No classes are assigned to this account.')}</div>`;
}else if(page==='assignments'){c.innerHTML=head('Assignments','Read the requirements, submit your work, and review instructor feedback.')+`<div class="stack">${data.assignments.map(assignmentCard).join('')||empty('No assignments yet. Check back after your instructor publishes coursework.')}</div>`;
}else if(page==='lessons'){c.innerHTML=head('Lessons','Course materials and practical walkthroughs.')+`<div class="grid two">${data.lessons.map(lessonCard).join('')||empty('No lessons have been published yet.')}</div>`;
}else if(page==='announcements'){c.innerHTML=head('Announcements','Updates from your instructors.')+`<div class="stack">${data.announcements.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><p class="muted small">${esc(a.createdAt)} · ${esc(a.createdBy)}</p><p>${esc(a.body)}</p></div>`).join('')||empty('No announcements yet.')}</div>`;
}else if(page==='manage'){c.innerHTML=head('Create coursework','Publish a lesson or assignment to a class.')+`<div class="grid two"><div class="card"><h3>New assignment</h3><form id="assignment-form"><label>Class</label><select name="classId">${data.classes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><label>Title</label><input name="title" required maxlength="120" placeholder="e.g. Build your first API"><label>Instructions</label><textarea name="instructions" required maxlength="12000" placeholder="Explain the task, requirements, and what to submit."></textarea><div class="form-grid"><div><label>Points</label><input name="points" type="number" min="1" max="1000" value="100" required></div><div><label>Due date</label><input name="dueDate" type="date"></div></div><label>Resource URL (optional, HTTPS)</label><input name="resourceUrl" type="url" placeholder="https://..."><button style="margin-top:16px" type="submit">Publish assignment</button></form></div><div class="card"><h3>New lesson</h3><form id="lesson-form"><label>Class</label><select name="classId">${data.classes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><label>Lesson title</label><input name="title" required maxlength="120" placeholder="e.g. Understanding HTTP"><label>Lesson content</label><textarea name="content" required maxlength="12000" placeholder="Write the lesson text here…"></textarea><label>Resource URL (optional, HTTPS)</label><input name="resourceUrl" type="url" placeholder="https://..."><button style="margin-top:16px" type="submit">Publish lesson</button></form></div><div class="card full"><h3>New announcement</h3><form id="announcement-form"><label>Title</label><input name="title" required maxlength="120"><label>Message</label><textarea name="body" required maxlength="4000"></textarea><button style="margin-top:16px" type="submit">Publish announcement</button></form></div></div>`;
$('assignment-form').onsubmit=e=>submitForm(e,'createAssignment','Assignment published.');$('lesson-form').onsubmit=e=>submitForm(e,'createLesson','Lesson published.');$('announcement-form').onsubmit=e=>submitForm(e,'createAnnouncement','Announcement published.');
}else if(page==='grading'){c.innerHTML=head('Review submissions','Review student work and provide grades and feedback.')+'<div id="submissions-list" class="stack">Loading submissions…</div>';loadSubmissions();
}else if(page==='students'){c.innerHTML=head('Enrollment','Move a student into a different class using their username.')+`<div class="card" style="max-width:650px"><form id="enroll-form"><label>Student username</label><input name="username" required placeholder="student_username"><label>Class</label><select name="classId">${data.classes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><button style="margin-top:16px">Update enrollment</button></form><p class="small muted">Students create their own account; this form only changes class enrollment.</p></div>`;$('enroll-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call('setEnrollment',{username:f.get('username'),classId:f.get('classId')});notice('Enrollment updated.');e.target.reset();}catch(err){showError(err);}};
}else if(page==='about'){c.innerHTML=head('About Revival Labs Classroom','A free, project-based learning platform.')+`<div class="card"><h3>Learn by building</h3><p>Revival Labs teaches the architecture behind game revival projects through original prototypes, backend development, APIs, and practical assignments.</p><div class="divider"></div><h3>Class tracks</h3><p><b>Class A — Foundations:</b> beginner concepts, HTTP, JSON, and your first local backend.</p><p><b>Class B — Backend Development:</b> APIs, persistent data, and client integration.</p><p><b>Class C — Systems Engineering:</b> advanced architecture, testing, reliability, and a capstone project.</p><div class="divider"></div><p class="small muted">Do not upload passwords, private keys, sensitive personal data, or private information about other people. Only share project links you are authorized to share.</p></div>`;
}}
async function refresh(){dashboardData=await call('getDashboard');renderShell();renderPage(activePage);}
async function submitForm(e,action,message){e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form).entries());try{await call(action,data);await refresh();notice(message);}catch(err){showError(err);}}
async function openClass(id){try{const r=await call('getClassroom',{classId:id});showModal(`<div class="modal-head"><div><h2>${esc(r.classInfo.name)}</h2><p class="muted">${esc(r.classInfo.description)}</p></div><button class="secondary" onclick="closeModal()">Close</button></div><div class="divider"></div><h3>Lessons</h3><div class="stack">${r.lessons.map(l=>`<div class="card"><h3>${esc(l.title)}</h3><p>${esc(l.content.slice(0,180))}${l.content.length>180?'…':''}</p><button class="secondary" onclick="viewLesson('${esc(l.id)}')">Read lesson</button></div>`).join('')||empty('No lessons published yet.')}</div><div class="divider"></div><h3>Assignments</h3><div class="stack">${r.assignments.map(assignmentCard).join('')||empty('No assignments published yet.')}</div>`);}catch(e){showError(e);}}
function viewLesson(id){const l=dashboardData.lessons.find(x=>x.id===id);if(!l){showError(new Error('Lesson is not available in this view. Open it from its class or refresh the page.'));return;}showModal(`<div class="modal-head"><h2>${esc(l.title)}</h2><button class="secondary" onclick="closeModal()">Close</button></div><div class="divider"></div><p style="white-space:pre-wrap">${esc(l.content)}</p>${l.resourceUrl?`<p><a class="link" href="${esc(l.resourceUrl)}" target="_blank" rel="noopener">Open lesson resource ↗</a></p>`:''}`);}
function openAssignment(id){const a=dashboardData.assignments.find(x=>x.id===id);if(!a){showError(new Error('Assignment is not available. Refresh and try again.'));return;}if(currentUser.role!=='student'){showModal(`<div class="modal-head"><h2>${esc(a.title)}</h2><button class="secondary" onclick="closeModal()">Close</button></div><p>${esc(a.instructions)}</p><p class="muted">${esc(a.points)} points · Due ${dateFmt(a.dueDate)}</p>`);return;}const s=a.mySubmission;showModal(`<div class="modal-head"><h2>${esc(a.title)}</h2><button class="secondary" onclick="closeModal()">Close</button></div><p class="muted">${esc(a.className||'Class assignment')} · ${esc(a.points)} points · Due ${dateFmt(a.dueDate)}</p><div class="divider"></div><h3>Instructions</h3><p style="white-space:pre-wrap">${esc(a.instructions)}</p>${a.resourceUrl?`<p><a class="link" href="${esc(a.resourceUrl)}" target="_blank" rel="noopener">Open resource ↗</a></p>`:''}<div class="divider"></div>${s&&s.status==='graded'?`<div class="notice">Grade: ${esc(s.grade)} / ${esc(a.points)}${s.feedback?'<br>Feedback: '+esc(s.feedback):''}</div>`:''}<form id="submission-form"><label>Written response (optional if you add a link)</label><textarea name="content" maxlength="12000" placeholder="Describe your work or paste your answer here…">${esc(s?s.content:'')}</textarea><label>Project link (optional)</label><input name="projectUrl" type="url" placeholder="https://github.com/…" value="${esc(s?s.projectUrl:'')}"><button style="margin-top:16px">${s?'Update submission':'Submit assignment'}</button></form>`);$('submission-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call('submitAssignment',{assignmentId:a.id,content:f.get('content'),projectUrl:f.get('projectUrl')});closeModal();await refresh();notice('Your work has been submitted.');}catch(err){const m=$('modal-notice');if(m){m.textContent=err.message;m.classList.remove('hidden');}else showError(err);}};}
async function loadSubmissions(){try{const r=await call('listSubmissions');const box=$('submissions-list');if(!box)return;box.innerHTML=r.submissions.map(s=>`<div class="card"><div class="item"><div class="item-main"><span class="pill">${esc(s.status)}</span><h3 style="margin-top:8px">${esc(s.studentName)} · ${esc(s.assignmentTitle)}</h3><p class="muted small">Submitted ${esc(s.submittedAt)}</p></div>${s.status==='graded'?`<span class="pill">${esc(s.grade)} points</span>`:''}</div>${s.content?`<p style="white-space:pre-wrap">${esc(s.content)}</p>`:''}${s.projectUrl?`<p><a class="link" target="_blank" rel="noopener" href="${esc(s.projectUrl)}">Open project link ↗</a></p>`:''}${s.feedback?`<p class="muted">Previous feedback: ${esc(s.feedback)}</p>`:''}<div class="actions"><button onclick="grade('${esc(s.id)}','${esc(s.assignmentTitle)}','${esc(s.grade)}','${esc(s.feedback)}')">${s.status==='graded'?'Edit grade':'Grade submission'}</button></div></div>`).join('')||empty('No submissions yet.');}catch(e){showError(e);}}
async function grade(id,title,oldGrade,oldFeedback){const r=await call('listSubmissions');const s=r.submissions.find(x=>x.id===id);const assignment=dashboardData.assignments.find(a=>a.id===s?.assignmentId);const points=assignment?assignment.points:100;showModal(`<div class="modal-head"><h2>Grade submission</h2><button class="secondary" onclick="closeModal()">Close</button></div><p>${esc(title)}</p><form id="grade-form"><label>Grade (out of ${esc(points)})</label><input name="grade" type="number" min="0" max="${esc(points)}" step="0.5" required value="${esc(oldGrade||'')}"><label>Feedback</label><textarea name="feedback" maxlength="4000">${esc(oldFeedback||'')}</textarea><button style="margin-top:16px">Save grade</button></form>`);$('grade-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call('gradeSubmission',{submissionId:id,grade:f.get('grade'),feedback:f.get('feedback')});closeModal();await loadSubmissions();notice('Grade saved.');}catch(err){showError(err);}};}
function showModal(html){$('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}<div id="modal-notice" class="notice hidden" style="margin-top:14px"></div></div></div>`;}
function closeModal(){$('modal-root').innerHTML='';}
(async()=>{if(token){await loadApp();}else renderAuth();})();
</script></body></html>
